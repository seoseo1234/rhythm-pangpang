<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>리듬 팡팡</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3d2a5c;--accent:#ff8a3d;--gold:#ffd23d;--purple:#5a2d82;--bg:#2a1b4d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Jua","Malgun Gothic",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  /* 노치·홈 바를 피한 실제 사용 영역 */
  :root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
    --vw:calc(100vw - var(--sl) - var(--sr));--vh:calc(100vh - var(--st) - var(--sb))}
  @supports (height:100dvh){:root{--vh:calc(100dvh - var(--st) - var(--sb))}}
  button{font-family:inherit}
  #stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;padding:var(--st) var(--sr) var(--sb) var(--sl)}
  #stage{position:relative;width:min(var(--vw),calc(var(--vh) * 16 / 9));height:min(calc(var(--vw) * 9 / 16),var(--vh))}
  canvas{width:100%;height:100%;display:block}
  #quit{position:absolute;top:2.5%;right:1.5%;font-size:clamp(14px,1.8vw,18px);border:3px solid #fff;border-radius:999px;padding:6px 16px;min-height:40px;background:rgba(61,42,92,.75);color:#fff;cursor:pointer}

  .screen{position:fixed;inset:0;display:flex;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:max(16px,var(--st)) max(16px,var(--sr)) max(16px,var(--sb)) max(16px,var(--sl));
    background:repeating-linear-gradient(45deg,#4b2a85 0 40px,#55308f 40px 80px);background-size:113px 113px;animation:slide 4s linear infinite}
  @keyframes slide{to{background-position:113px 0}}
  .hidden{display:none!important}
  .inner{margin:auto;width:100%;max-width:980px;text-align:center}

  /* 큰 버튼 */
  .btn{border:4px solid #fff;border-radius:999px;padding:12px 34px;font-size:clamp(20px,3vw,30px);color:#fff;cursor:pointer;
    background:linear-gradient(#ffb347,#ff7a2f);box-shadow:0 7px 0 #c4501a,0 12px 24px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;margin:6px}
  @media (hover:hover){.btn:hover{transform:translateY(-2px)}}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c4501a,0 4px 10px rgba(0,0,0,.3)}
  .btn.blue{background:linear-gradient(#7cc8ff,#3d8cf0);box-shadow:0 7px 0 #2560b0,0 12px 24px rgba(0,0,0,.3)}
  .btn.small{font-size:20px;padding:8px 20px}

  /* 타이틀 */
  .logo{font-size:clamp(54px,11vw,120px);color:var(--gold);margin:0;line-height:1.1;
    text-shadow:0 6px 0 #c47a00,5px 5px 0 var(--purple),-5px -5px 0 var(--purple),5px -5px 0 var(--purple),-5px 5px 0 var(--purple),0 14px 20px rgba(0,0,0,.4)}
  .logo span{display:inline-block;animation:hop .6s ease-in-out infinite alternate}
  @keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}
  .tag{color:#fff;font-size:clamp(18px,2.6vw,26px);margin:10px 0 24px;opacity:.9}
  .crew{font-size:clamp(40px,7vw,70px);margin:10px 0 26px}
  .crew span{display:inline-block;animation:hop .45s ease-in-out infinite alternate}
  .press{color:#fff;margin-top:18px;font-size:18px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  #startBtn{animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}

  /* 게임 고르기 */
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .head h2{margin:0;color:#fff;font-size:clamp(30px,5vw,46px);text-shadow:0 4px 0 var(--purple)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{background:#fff;border:0;border-radius:26px;padding:0;overflow:hidden;cursor:pointer;color:var(--ink);text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .12s}
  @media (hover:hover){.card:hover{transform:translateY(-6px) rotate(-1deg)}}
  .card:active{transform:scale(.97)}
  .card .thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:66px;position:relative}
  .card .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 60%)}
  .card .num{position:absolute;top:10px;left:12px;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;font-size:16px;padding:2px 10px}
  .card .nm{font-size:26px;margin:10px 0 2px}
  .card .ds{font-size:15px;color:#8a7a99;padding:0 12px}
  .card .best{font-size:26px;color:#ffc400;padding:6px 0 12px;letter-spacing:3px}
  .card .best i{font-style:normal;color:#e4dcea}
  .bar{margin-top:18px;background:rgba(0,0,0,.28);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center;color:#fff;font-size:18px}
  .seg{display:inline-flex;border-radius:999px;overflow:hidden;border:3px solid #fff;margin-left:6px}
  .seg button{font-size:16px;border:0;padding:7px 12px;min-height:38px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
  .seg button.on{background:#fff;color:var(--purple)}
  input[type=range]{width:130px;accent-color:var(--gold);vertical-align:middle}

  /* 설명 / 결과 카드 */
  .sheet{background:#fff;border-radius:32px;max-width:640px;margin:auto;overflow:hidden;box-shadow:0 12px 0 rgba(0,0,0,.25);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popIn{from{transform:scale(.6);opacity:0}}
  .sheet .top{padding:20px;color:#fff;position:relative}
  .sheet .top .emo{font-size:80px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
  .sheet .top h3{margin:6px 0 0;font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
  .steps{list-style:none;margin:0;padding:18px 26px 6px;text-align:left}
  .steps li{font-size:21px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;line-height:1.4}
  .steps li b.n{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
  .sheet .foot{padding:10px 18px 22px}
  .keyhint{color:#8a7a99;font-size:17px;margin-bottom:6px}

  .rank{width:150px;height:150px;border-radius:50%;margin:6px auto 0;display:flex;align-items:center;justify-content:center;font-size:96px;color:#fff;
    background:radial-gradient(circle at 35% 30%,#ffe680,#ffb300);border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:stamp .5s .2s cubic-bezier(.3,1.8,.5,1) both}
  @keyframes stamp{from{transform:scale(3) rotate(-30deg);opacity:0}}
  .rstars{font-size:58px;margin:8px 0 0;letter-spacing:6px}
  .rstars span{display:inline-block;color:#e4dcea}
  .rstars span.on{color:#ffc400;animation:starPop .4s cubic-bezier(.3,1.8,.5,1) both}
  @keyframes starPop{from{transform:scale(0) rotate(-90deg)}}
  .grade{font-size:34px;margin:4px 0}
  .score{font-size:48px;color:var(--accent);margin:0}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 16px}
  .stat{background:#f6f1fa;border-radius:16px;padding:8px 14px;font-size:17px;min-width:96px}
  .stat b{display:block;font-size:30px}
  .tip{background:#fff7e6;border-radius:16px;padding:12px 16px;font-size:19px;margin:10px 20px;line-height:1.5}
  .newrec{position:absolute;top:16px;right:-38px;transform:rotate(35deg);background:#ff4d6d;color:#fff;padding:4px 44px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.2)}

  /* 터치 기기에서는 키보드 안내 대신 터치 안내 */
  .touch-only{display:none}
  .touch .kbd-only{display:none!important}.touch .touch-only{display:inline}

  /* 가로로 돌려 주세요 */
  #rotate .phone{font-size:90px;display:inline-block;animation:turn 1.6s ease-in-out infinite}
  @keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #rotate p{color:#fff;font-size:26px;margin:16px 0 22px;line-height:1.5}

  /* 좁은 화면(세로 휴대폰) */
  @media (max-width:600px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{border-radius:20px}
    .card .thumb{height:78px;font-size:46px}
    .card .num{font-size:13px;top:6px;left:8px}
    .card .nm{font-size:20px;margin-top:6px}
    .card .ds{font-size:13px;padding:0 8px}
    .card .best{font-size:20px;padding:4px 0 10px}
    .head .btn.small{font-size:15px;padding:6px 12px}
    .head > div{display:none}
    .bar{font-size:15px;gap:8px 12px;padding:10px}
    .seg button{font-size:14px;padding:7px 9px}
    .steps{padding:12px 16px 4px}
    .steps li{font-size:17px}
    .sheet .top h3{font-size:32px}
    .rank{width:110px;height:110px;font-size:70px}
    .stat{min-width:72px;padding:6px 10px;font-size:14px}
    .stat b{font-size:24px}
    .tip{font-size:16px;margin:8px 12px}
    .btn{padding:10px 22px}
  }
  /* 낮은 화면(가로 휴대폰) */
  @media (max-height:500px){
    .logo{font-size:min(16vh,90px)}
    .tag{margin:4px 0 8px;font-size:18px}
    .crew{font-size:min(11vh,56px);margin:4px 0 10px}
    .press{margin-top:6px}
    .btn{font-size:20px;padding:8px 24px;margin:4px}
    .head{margin-bottom:8px}
    .head h2{font-size:28px}
    .grid{grid-template-columns:repeat(3,1fr);gap:10px}
    .card .thumb{height:62px;font-size:40px}
    .card .nm{font-size:19px;margin-top:4px}
    .card .ds{display:none}
    .card .best{font-size:18px;padding:2px 0 8px}
    .bar{margin-top:10px;padding:8px;font-size:15px}
    .sheet{border-radius:24px}
    .sheet .top{padding:10px}
    .sheet .top .emo{font-size:44px}
    .sheet .top h3{font-size:26px;margin-top:2px}
    .steps{padding:8px 20px 0}
    .steps li{font-size:16px;margin:5px 0}
    .steps li b.n{width:26px;height:26px;font-size:14px}
    .sheet .foot{padding:6px 12px 12px}
    .rank{width:84px;height:84px;font-size:52px;border-width:4px}
    .rstars{font-size:34px;margin-top:2px}
    .grade{font-size:24px;margin:0}
    .score{font-size:30px}
    .stats{margin:6px 10px;gap:6px}
    .stat{min-width:70px;padding:4px 10px;font-size:13px}
    .stat b{font-size:20px}
    .tip{font-size:15px;margin:6px 14px;padding:8px 12px}
    #rotate .phone{font-size:60px}
  }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage"><canvas id="cv" width="960" height="540"></canvas><button id="quit" class="hidden">✕ 그만하기</button></div></div>

<!-- 타이틀 -->
<div id="title" class="screen">
  <div class="inner">
    <h1 class="logo" id="logo"></h1>
    <div class="tag">♪ 소리를 듣고, 박자에 맞춰 톡! ♪</div>
    <div class="crew"><span>🐥</span> <span style="animation-delay:.15s">🐻</span> <span style="animation-delay:.3s">🐰</span> <span style="animation-delay:.45s">🐧</span> <span style="animation-delay:.6s">🦔</span></div>
    <button class="btn" id="startBtn">▶ 시작하기</button>
    <div class="press kbd-only">스페이스바를 눌러도 시작해요</div>
  </div>
</div>

<!-- 게임 고르기 -->
<div id="select" class="screen hidden">
  <div class="inner">
    <div class="head">
      <button class="btn blue small" id="backTitle">◀ 처음으로</button>
      <h2>게임 고르기</h2>
      <div style="width:120px"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bar">
      <span>빠르기<span class="seg" id="spd"><button data-v="80">🐢 느리게</button><button data-v="100" class="on">🐇 보통</button><button data-v="120">🚀 빠르게</button></span></span>
      <span>음악<span class="seg" id="mus"><button data-v="1" class="on">켜기</button><button data-v="0">끄기</button></span></span>
      <span>메트로놈<span class="seg" id="met"><button data-v="1">켜기</button><button data-v="0" class="on">끄기</button></span></span>
      <span title="블루투스 스피커처럼 소리가 늦게 나오면 오른쪽으로 옮겨요">소리 지연 보정 <input id="ofs" type="range" min="-150" max="250" step="10" value="0"> <span id="ofsv">0ms</span></span>
    </div>
  </div>
</div>

<!-- 게임 설명 -->
<div id="howto" class="screen hidden">
  <div class="inner">
    <div class="sheet">
      <div class="top" id="hTop"><div class="emo" id="hEmo"></div><h3 id="hName"></h3></div>
      <ul class="steps" id="hSteps"></ul>
      <div class="foot">
        <div class="keyhint"><span class="kbd-only">⌨️ 스페이스바 · 🖱️ 클릭 · 👆 화면 터치 — 아무거나 OK!</span><span class="touch-only">👆 게임 중엔 화면 아무 곳이나 톡! 누르면 돼요</span></div>
        <button class="btn blue small" id="hBack">◀ 뒤로</button>
        <button class="btn" id="hGo">▶ 시작!</button>
      </div>
    </div>
  </div>
</div>

<!-- 휴대폰 세로일 때: 가로로 돌려 주세요 -->
<div id="rotate" class="screen hidden">
  <div class="inner">
    <div class="phone">📱</div>
    <p>휴대폰을 <b style="color:#ffd23d">가로로</b> 돌려 주세요!<br><span style="font-size:19px;opacity:.85">화면이 넓어야 더 재밌어요</span></p>
    <button class="btn blue small" id="rBack">◀ 뒤로</button>
    <button class="btn small" id="rAnyway">세로로 그냥 할래요</button>
  </div>
</div>

<!-- 결과 -->
<div id="result" class="screen hidden">
  <div class="inner">
    <div class="sheet" style="position:relative">
      <div class="top" id="rTop" style="padding-bottom:10px">
        <div style="font-size:24px" id="rName"></div>
        <div class="rank" id="rRank"></div>
        <div class="newrec hidden" id="rNew">신기록!</div>
      </div>
      <div class="rstars" id="rStars"></div>
      <div class="grade" id="rGrade"></div>
      <p class="score" id="rScore">0</p>
      <div class="stats">
        <div class="stat">딱 맞아요<b id="rP" style="color:#f5a300"></b></div>
        <div class="stat">좋아요<b id="rG" style="color:#3bb273"></b></div>
        <div class="stat">놓쳤어요<b id="rM" style="color:#b0a4ba"></b></div>
        <div class="stat">최고 콤보<b id="rC" style="color:#9b5de5"></b></div>
      </div>
      <div class="tip" id="rTip"></div>
      <div class="foot">
        <button class="btn" id="again">🔁 다시 하기</button>
        <button class="btn blue" id="toSelect">🎮 다른 게임</button>
      </div>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const W = 960, H = 540;
const $ = id => document.getElementById(id);

/* ================= 오디오 (모든 소리를 직접 합성) ================= */
let AC = null, master = null, musicBus = null, noiseBuf = null;
function audio() {
  if (!AC) {
    // iOS: 무음 모드 스위치가 켜져 있어도 소리가 나도록 (처음 한 번만 — 매번 바꾸면 사파리가 오디오를 중단시킴)
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {}
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 들리지 않는 아주 작은 소리를 계속 흘려서, 게임 사이 조용할 때 iOS가 오디오를 재우지 않게 함
    const keep = AC.createOscillator(), kg = AC.createGain();
    kg.gain.value = 0.00001; keep.frequency.value = 40; keep.connect(kg); kg.connect(AC.destination); keep.start();
  }
  // 'suspended'뿐 아니라 iOS의 'interrupted'(전화·알림·화면 전환 뒤)도 다시 깨움
  if (AC.state !== 'running') { try { AC.resume().catch(() => {}); } catch (e) {} }
}
const audioReady = () => AC && AC.state === 'running';
// iOS는 touchend·click 안에서만 오디오를 깨울 수 있어서, 화면을 만질 때마다 확인
['touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => { if (AC && AC.state !== 'running') audio(); }, { capture: true, passive: true }));
const lat = () => (AC.outputLatency || AC.baseLatency || 0);
function env(t, peak, dur, bus = master) {
  const gn = AC.createGain();
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(peak, t + 0.005);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  gn.connect(bus); return gn;
}
function tone(t, f, dur, type = 'sine', vol = 0.5, f2, bus) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  o.connect(env(t, vol, dur, bus)); o.start(t); o.stop(t + dur + 0.03);
}
function nz(t, freq, q, dur, vol, bus) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  s.connect(bp); bp.connect(env(t, vol, dur, bus)); s.start(t); s.stop(t + dur + 0.03);
}
const SFX = {
  tick:    t => tone(t, 1600, 0.04, 'sine', 0.14),
  count:   (t, last) => tone(t, last ? 1046 : 784, 0.14, 'triangle', 0.35),
  clapT:   t => { nz(t, 1100, 1.2, 0.13, 0.9); tone(t, 520, 0.05, 'triangle', 0.15); },
  clapP:   t => { nz(t, 1700, 1.4, 0.11, 0.9); nz(t + 0.006, 2600, 2, 0.06, 0.4); },
  throwN:  t => tone(t, 700, 0.11, 'square', 0.13, 1400),
  throwS:  t => tone(t, 260, 0.32, 'triangle', 0.4, 420),
  hit:     t => { tone(t, 900, 0.07, 'square', 0.12, 500); nz(t, 3500, 1, 0.05, 0.5); },
  stamp:   t => { tone(t, 150, 0.16, 'sine', 0.85, 50); nz(t, 700, 0.8, 0.08, 0.5); },
  machine: t => { nz(t, 5000, 3, 0.04, 0.35); tone(t, 2400, 0.02, 'square', 0.04); },
  beep:    t => tone(t, 988, 0.12, 'square', 0.12),
  launch:  t => { nz(t, 900, 0.6, 0.45, 0.6); tone(t, 200, 0.4, 'sawtooth', 0.12, 900); },
  boing:   t => tone(t, 220, 0.18, 'sine', 0.45, 520),
  pop:     t => { nz(t, 2500, 0.8, 0.07, 1); tone(t, 1200, 0.05, 'triangle', 0.2, 300); },
  kungW:   t => { tone(t, 150, 0.2, 'sine', 0.8, 50); nz(t, 300, 1, 0.08, 0.3); },
  skank:   (t, fs) => fs.forEach(f => tone(t, f, 0.1, 'square', 0.035, null, musicBus)),

/* ---------- 배경 음악 (BGM) ----------

   mel 악보: 토큰 하나 = 8분음표(반 박). c d e f g a b = 도레미파솔라시, 대문자 = 한 옥타브 위,

const SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
function parseMel(str) {

    else { last = { s: i * 0.5, n: SEMI[tk.toLowerCase()] + (tk === tk.toUpperCase() ? 12 : 0), d: 0.5 }; notes.push(last); }

const chordOf = r => { const q = [2, 4, 9].includes(((r % 12) + 12) % 12) ? [0, 3, 7] : [0, 4, 7]; return q.map(k => k + r); };
const semiF = (base, s) => base * Math.pow(2, s / 12);
function lead(t, f, dur) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
  const gn = AC.createGain(), end = t + Math.max(0.12, dur * 0.92);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.1, t + 0.12);
  gn.gain.setValueAtTime(0.1, end - 0.06);
  gn.gain.exponentialRampToValueAtTime(0.0001, end);

  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), vib = AC.createOscillator(), vg = AC.createGain();
  o1.type = 'square'; o2.type = 'triangle';
  o1.frequency.value = f; o2.frequency.value = f;
  vib.frequency.value = 5.5; vg.gain.value = f * 0.006; vib.connect(vg); vg.connect(o1.frequency); vg.connect(o2.frequency);
  const g1 = AC.createGain(); g1.gain.value = 0.35; o1.connect(g1); g1.connect(lp); o2.connect(lp);
  [o1, o2, vib].forEach(o => { o.start(t); o.stop(end + 0.05); });

    gn.gain.setValueAtTime(0.045, t + dur - 0.1);

// 박마다: 킥·스네어·베이스 (멜로디·화음은 startGame에서 따로 예약)
function playMusic(t, b, def) {
  const m = def.meter || 4, bar = Math.floor(b / m), bi = ((b % m) + m) % m;
  const prog = def.prog || [0, 5, 7, 5], r = prog[bar % prog.length], f = semiF(def.root || 110, r);
  if (bi === 0) tone(t, 130, 0.16, 'sine', 0.7, 45, musicBus);
  if (m === 4) {
    if (bi === 2) tone(t, 130, 0.14, 'sine', 0.45, 45, musicBus);
    if ((bi === 1 || bi === 3) && !def.noSnare) snare(t);
    tone(t, bi % 2 ? f * 1.5 : f, 0.22, 'triangle', 0.32, null, musicBus);
  } else {
    if (bi === 0) tone(t, f, 0.45, 'triangle', 0.35, null, musicBus);

}
function musicCues(def, len) {
  const cues = [], m = def.meter || 4, base = def.root || 110, mf = base * (def.melMul || 4);
  const prog = def.prog || [0, 5, 7, 5];
  if (m === 4) for (let bar = 0; bar * m < len; bar++)
    cues.push({ b: bar * m, s: 'pad', arg: chordOf(prog[bar % prog.length]).map(k => semiF(base * 2, k)) });

let S = null, curGame = 0, screen = 'title';

function startGame(idx) {
  audio(); curGame = idx;
  const def = GAMES[idx], spb = 60 / settings.bpm, meter = def.meter || 4;
  const chart = def.build();
  const cues = [];
  for (let i = 0; i < meter; i++) cues.push({ b: i - meter, s: 'count', arg: i === meter - 1 });
  for (let b = 0; b < chart.len; b++) {
    if (settings.music) {
      cues.push({ b, s: 'music', arg: b });
      if (!def.noHat) cues.push({ b: b + 0.5, s: 'hat' });
    }
    if (def.alwaysTick || settings.metro) cues.push({ b, s: def.tick || 'tick' });
  }
  if (settings.music) cues.push(...musicCues(def, chart.len));
  cues.push(...chart.cues);
  cues.sort((a, b) => a.b - b.b);
  S = {
    def, chart, spb, cues, ci: 0, meter,
    t0: AC.currentTime + 0.5 + meter * spb,
    targets: chart.targets.map(x => ({ ...x, res: null, dt: 0 })),
    fx: [], parts: [], pressB: -99, over: false,

}

function schedule() {
  if (!S || S.over) return;
  const until = AC.currentTime + 0.15;
  while (S.ci < S.cues.length) {
    const c = S.cues[S.ci], t = S.t0 + c.b * S.spb;
    if (t > until) break;
    if (t >= AC.currentTime - 0.03) {
      const tt = Math.max(t, AC.currentTime);
      if (c.s === 'music') playMusic(tt, c.arg, S.def);
      else if (c.s === 'hat') hat(tt);
      else if (c.s === 'mel') lead(tt, c.arg.f, c.arg.d * S.spb);
      else if (c.s === 'pad') pad(tt, c.arg, S.meter * S.spb);
      else SFX[c.s](tt, c.arg);
    }
    S.ci++;
  }
}
setInterval(schedule, 20);

  for (let i = 0; i < n; i++) {

    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, c: colors[i % colors.length], s: 5 + Math.random() * 6, star: Math.random() < 0.4 });

function press() {

  if (b < -0.5) return;
  SFX[S.def.hitSnd](AC.currentTime);
  S.pressB = nowBeat();
  let tgBest = null, bd = 1e9;
  for (const tg of S.targets) {
    if (tg.res) continue;

    if (d <= WINDOW && d < bd) { bd = d; tgBest = tg; }
  }
  const [fx, fy] = S.def.fxPos;
  if (!tgBest) { addFx('앗!', fx, fy, '#b0a4ba', 28); return; }
  tgBest.dt = (b - tgBest.b) * S.spb;
  tgBest.hitB = S.pressB;
  S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); S.comboT = performance.now();

    tgBest.res = 'good'; S.score += 50;
    addFx(tgBest.dt < 0 ? '좋아요 · 조금 빨라요' : '좋아요 · 조금 늦어요', fx, fy, '#3bb273', 30);
  }

}

function update() {
  if (!S || S.over) return;
  const nb = nowBeat();
  for (const tg of S.targets) {
    if (!tg.res && (nb - tg.b) * S.spb > WINDOW) {
      tg.res = 'miss'; S.combo = 0;
      addFx('놓쳤어요', S.def.fxPos[0], S.def.fxPos[1], '#b0a4ba', 28);
    }
  }
  if (nb > S.chart.len + 1.5) finish();
}

  else if (avg > 0.035) tip = `🐢 조금 <b>늦게</b> 누르는 편이에요 (평균 ${Math.round(avg * 1000)}ms).<br>소리가 나기 전에 미리 준비하고 있어 봐요!`;
  else if (avg < -0.035) tip = `🐇 조금 <b>서두르는</b> 편이에요 (평균 ${Math.round(-avg * 1000)}ms).<br>마음속으로 "하나, 둘" 세면서 기다려 봐요!`;
  else tip = '🎯 빠르지도 늦지도 않게 박자를 정말 잘 맞춰요!';
  if (acc >= 0.8 && settings.music) tip += '<br>다음엔 <b>음악 끄기</b>에 도전해 봐요!';
  else if (acc >= 0.8 && settings.bpm < 120) tip += '<br>다음엔 <b>더 빠르게</b> 도전해 봐요!';

  const prev = best[def.id] || { stars: 0, score: 0 };
  const isNew = S.score > prev.score;
  best[def.id] = { stars: Math.max(prev.stars, stars), score: Math.max(prev.score, S.score) };
  saveBest();

  $('rTop').style.background = def.color;
  $('rName').textContent = def.emoji + ' ' + def.name;
  $('rRank').textContent = rank;
  $('rStars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${0.7 + i * 0.25}s">★</span>`).join('');

  try {
    const p = req.call(el, { navigationUI: 'hide' });
    const o = window.screen.orientation;
    if (p && p.then) p.then(() => o && o.lock && o.lock('landscape').catch(() => {})).catch(() => {});
  } catch (e) {}

  const w = Math.max(1, Math.round(r.width * k)), h = Math.max(1, Math.round(r.height * k));

  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}

      targets.push({ b: s + 3 * d, start: s, d, i });
    });
    const last = targets[targets.length - 1].b;
    return { len: Math.ceil(last + 2), cues, targets };
  },
  onHit() { burst(480, 400, ['#ff9f1c', '#ffd23d', '#fff'], 18, 6); },
  draw(nb) {
    vgrad('#1d2257', '#4b3f9a');
    for (let i = 0; i < 40; i++) {
      const x = (i * 197) % W, y = (i * 113) % 360, tw = 0.5 + 0.5 * Math.sin(performance.now() / 300 + i);
      circ(x, y, 1.5 + tw, `rgba(255,255,255,${0.4 + tw * 0.5})`);
    }
    circ(820, 90, 44, '#f5e9c8'); circ(805, 80, 8, '#e3d4ae'); circ(835, 105, 6, '#e3d4ae');
    rrect(-20, 440, W + 40, 120, 40, '#5b4a85');
    rrect(410, 425, 140, 22, 8, '#8a7ab5');
    const ts = S.targets;
    let idx = ts.findIndex(t => nb < t.b + 1); if (idx < 0) idx = ts.length - 1;
    const cur = ts[idx], prevB = idx ? ts[idx - 1].b : -3;
    const slide = ease((nb - (prevB + 1)) / 0.4);
    let rx = 480 + (1 - slide) * 560, ry = 360, flame = false;
    if ((cur.res === 'perfect' || cur.res === 'good') && nb > cur.hitB) {
      const d = nb - cur.hitB; ry = 360 - d * d * 380 - d * 60; flame = true;
    } else if (cur.res === 'miss') {
      rx += Math.sin(nb * 40) * 3;
      for (let k = 0; k < 3; k++) circ(470 + k * 12, 300 - frac(nb + k * 0.3) * 60, 14 + k * 4, 'rgba(200,200,220,.5)');
    }
    rocket(rx, ry, ROCKET_COLORS[cur.i % ROCKET_COLORS.length], flame);
    // 카운트다운 숫자
    for (let k = 0; k < 3; k++) {
      const bk = cur.start + k * cur.d;
      if (nb >= bk && nb < cur.b + 0.2 && (k === 2 || nb < cur.start + (k + 1) * cur.d)) {
        const a = ease((nb - bk) * 4), sc = 1.4 - a * 0.4;
        text(String(3 - k), 480, 150, 110 * sc, '#ffd23d', 'center', '#2a1b4d', 12);
      }
    }
    if ((cur.res === 'perfect' || cur.res === 'good') && nb - cur.hitB < 0.9) text('발사!', 480, 150, 90, '#ff9f1c', 'center', '#2a1b4d', 12);
    // 조종석
    const pa = pressAnim(nb, 0.2);
    rrect(110, 380, 180, 80, 20, '#d9d4ee'); rrect(110, 440, 180, 20, 0, '#b8b0da');
    ell(200, 395 + pa * 8, 46, 20, 0, '#b8323b'); ell(200, 385 + pa * 10, 46, 20, 0, '#ff4d5a');
    critter(200, 300, 52, '#ffffff', 'bunny', 0.2 + pa * 0.5, 1, pa > 0.3);
    circ(200, 300, 60, null, 'rgba(160,220,255,.7)', 5);
    rrect(640, 470, 290, 40, 20, 'rgba(255,255,255,.15)');
    text(`🚀 ${Math.min(idx + 1, ts.length)} / ${ts.length}`, 785, 490, 24, '#fff');
  },
};
function rocket(x, y, col, flame) {
  if (flame) {
    const f = Math.random();
    tri(x - 20, y + 55, x + 20, y + 55, x, y + 120 + f * 40, '#ff9f1c');
    tri(x - 11, y + 55, x + 11, y + 55, x, y + 95 + f * 25, '#ffe066');
  }
  tri(x - 30, y + 10, x - 30, y + 62, x - 58, y + 62, col);
  tri(x + 30, y + 10, x + 30, y + 62, x + 58, y + 62, col);
  g.save(); g.beginPath(); g.ellipse(x, y, 32, 66, 0, 0, Math.PI * 2); g.fillStyle = '#f4f4fb'; g.fill(); g.clip();
  g.fillStyle = col; g.fillRect(x - 40, y - 70, 80, 30); g.fillRect(x - 40, y + 46, 80, 30); g.restore();
  circ(x, y - 4, 13, '#7fd6ff', '#9aa0c0', 5);
  rrect(x - 6, y + 52, 12, 14, 3, '#9aa0c0');
}

/* ================= 게임 5: 엇박 풍선 ================= */
// 첫 마디(0~3박)는 고슴도치 '쿵'만 듣기. 풍선은 모두 박과 박 사이(.5)
const G5_BEATS = [
  ...Array.from({ length: 12 }, (_, i) => i + 4.5),
  16.5, 17.5, 19.5, 20.5, 21.5, 23.5, 24.5, 25.5, 27.5, 28.5, 29.5, 31.5,
  32.5, 33.5, 34.5, 35.5, 36.5, 38.5, 39.5, 40.5, 41.5, 42.5, 43.5,
];
const BALLOON_COLORS = ['#ff5a5f', '#ffb703', '#2ec4b6', '#9b5de5', '#3d8cf0', '#ff6f91'];
const game5 = {
  id: 'balloon', name: '엇박 풍선', emoji: '🎈', color: 'linear-gradient(135deg,#6be3d2,#1fa99b)', solid: '#2ec4b6',
  short: '"쿵"과 "쿵" 사이에 펑!', prog: [0, 5, 7, 0, 0, 5, 7, 0], root: 110,
  mel: 'c _ e _ g _ e _ | f _ a _ C _ a _ | g _ b _ D _ b _ | C _ g _ e _ c _ | e _ g _ C _ g _ | a _ C _ F _ C _ | D _ b _ g _ b _ | C . . . c . . .', tick: 'boing', alwaysTick: true, noHat: true,
  how: ['고슴도치가 <b>"쿵, 쿵"</b> 박자에 맞춰 뛰어요.', '풍선은 <b>쿵과 쿵 사이</b>(엇박)에 바늘에 닿아요.', '노래 속 <b>"짝"</b> 소리가 바로 그 자리예요. "쿵 <b>짝</b> 쿵 <b>짝</b>" 짝에 맞춰 펑! 🎈', '이걸 잘하면 <b>엇박자</b> 박사가 돼요.'],
  hitSnd: 'pop', fxPos: [700, 190],
  build() {
    // 음악이 켜져 있으면 풍선 자리마다 노래 속 '짝' 화음(엇박 기타)이 같이 울림 → 노래를 따라 누르면 됨
    const cues = settings.music ? G5_BEATS.map(b => ({ b, s: 'skank', arg: chordOf(this.prog[Math.floor(b / 4) % this.prog.length]).map(k => semiF(this.root * 4, k)) })) : [];
    return { len: 48, cues, targets: G5_BEATS.map((b, i) => ({ b, c: BALLOON_COLORS[i % BALLOON_COLORS.length] })) };
  },
  onHit(t) { burst(520, 250, [t.c, '#fff', '#ffd23d'], 16, 6); },
  draw(nb) {
    vgrad('#c4f1ff', '#f0fbff');
    cloud(80, 110, 0.9); cloud(700, 70, 0.7); cloud(820, 300, 0.6);
    rrect(-20, 430, W + 40, 130, 40, '#9ee39a');
    // 고슴도치: 박(정수)에 착지
    const jump = nb >= 0 ? Math.sin(Math.PI * frac(nb)) * 70 : 0, land = beatPulse(nb);
    const hx = 220, hy = 390 - jump;
    ell(hx, 432, 60 - jump * 0.3, 10, 0, 'rgba(0,0,0,.12)');
    g.fillStyle = '#7a5134';
    for (let k = 0; k < 9; k++) { const a = Math.PI * (0.9 + k * 0.13); tri(hx + Math.cos(a - 0.12) * 50, hy + Math.sin(a - 0.12) * 44, hx + Math.cos(a + 0.12) * 50, hy + Math.sin(a + 0.12) * 44, hx + Math.cos(a) * 82, hy + Math.sin(a) * 74, '#7a5134'); }
    ell(hx, hy, 58 + land * 6, 48 - land * 6, 0, '#9b6a45');
    ell(hx + 30, hy + 8, 34, 30, 0, '#f2d3b0');
    eyes(hx + 34, hy - 2, 48, land > 0.5);
    circ(hx + 62, hy + 8, 6, '#3a2a20');
    if (land > 0.3) text('쿵!', hx, hy - 95, 30 * (0.8 + land * 0.4), '#7a5134', 'center', '#fff');
    // 바늘 든 새
    const pa = pressAnim(nb, 0.18), NX = 520, tipY = 205 + pa * 30;
    g.fillStyle = '#9aa0b5'; g.fillRect(NX - 3, 120 + pa * 30, 6, tipY - 120 - pa * 30);
    tri(NX - 3, tipY, NX + 3, tipY, NX, tipY + 14, '#9aa0b5');
    critter(NX, 95 + pa * 30, 42, '#ffd84d', 'chick', 0.8, 1, pa > 0.3);
    // 풍선 (아래에서 올라와 엇박에 바늘에 닿음)
    for (const t of S.targets) {
      let y = 260 + (t.b - nb) * 150;
      if (t.res === 'perfect' || t.res === 'good') continue;
      if (t.res === 'miss') y = 260 - (nb - t.b) * 300;
      if (y > 620 || y < -80) continue;
      g.strokeStyle = 'rgba(80,80,80,.5)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(NX, y + 46); g.quadraticCurveTo(NX + 10, y + 80, NX, y + 110); g.stroke();
      ell(NX, y, 36, 44, 0, t.c); ell(NX - 12, y - 16, 8, 13, -0.4, 'rgba(255,255,255,.5)');
      tri(NX - 6, y + 48, NX + 6, y + 48, NX, y + 40, t.c);
    }
    rrect(300, 470, 360, 44, 22, 'rgba(255,255,255,.9)');
    text('쿵  짝!  쿵  짝!  — 짝에 펑!', W / 2, 492, 26, '#1fa99b');
  },
};

/* ================= 게임 6: 왈츠 펭귄 (3박자) ================= */
// 처음 2마디는 듣기만 하고, 그다음 6마디씩 쿵 → 짝 짝 → 섞기
const G6_LISTEN = 2, G6_BARS = 20;
const G6_C = [[0], [0, 1, 2], [1, 2], [0, 2], [0], [0, 1, 2]];
const g6pat = bar => bar < G6_LISTEN ? [] : bar < 8 ? [0] : bar < 14 ? [1, 2] : G6_C[(bar - 14) % G6_C.length];
const g6label = bar => bar < G6_LISTEN ? '👂 먼저 들어 봐요: 쿵 짝 짝' : bar < 8 ? '공이 "쿵"에 떨어질 때 눌러요!' : bar < 14 ? '공이 "짝 짝"에 떨어질 때 눌러요!' : '주황 동그라미에 공이 떨어질 때!';
const G6_X = [380, 480, 580];
const game6 = {
  id: 'waltz', name: '왈츠 펭귄', emoji: '🐧', color: 'linear-gradient(135deg,#c79bff,#7b3fd1)', solid: '#9b5de5',
  short: '쿵 짝 짝, 세 박자 춤을 춰요', meter: 3, prog: [0, 7, 0, 5, 0, 7, 5, 0], root: 130.8, melMul: 2,
  mel: 'C . . . g . | b . . . D . | C . . . E . | D . C . a . | g . . . C . | b . a . g . | a . C . a . | C . . . . .',
  how: ['왈츠는 <b>"쿵 짝 짝"</b> 세 박자 음악이에요 🎻 처음 두 마디는 <b>듣기만</b> 해요.', '위쪽의 <b>통통 공</b>이 쿵·짝·짝 동그라미 위로 박자마다 떨어져요.', '처음엔 공이 <b>"쿵"</b>에 떨어질 때, 다음엔 <b>"짝 짝"</b>에 떨어질 때 눌러요.', '누를 박에는 <b>줄어드는 고리</b>가 생겨요. 고리가 딱 닿을 때 눌러요!'],
  hitSnd: 'bell', fxPos: [480, 255],
  build() {
    const targets = [], cues = [];
    for (let bar = 0; bar < G6_BARS; bar++) {
      for (const p of g6pat(bar)) targets.push({ b: bar * 3 + p, bar, p });
      // 음악을 꺼도 쿵(낮은 북)·짝(가벼운 소리)은 들리게
      if (!settings.music) { cues.push({ b: bar * 3, s: 'kungW' }); cues.push({ b: bar * 3 + 1, s: 'tick' }, { b: bar * 3 + 2, s: 'tick' }); }
    }
    return { len: G6_BARS * 3, cues, targets };
  },
  onHit() { burst(480, 330, ['#c79bff', '#ffd23d', '#ff6f91', '#fff'], 12, 5); },
  draw(nb) {
    vgrad('#3a1f6b', '#7b3fd1');
    for (let i = 0; i < 3; i++) {
      const x = 200 + i * 280, a = 0.12 + 0.08 * Math.sin(performance.now() / 600 + i);
      g.fillStyle = `rgba(255,230,255,${a})`; g.beginPath(); g.moveTo(x - 20, 0); g.lineTo(x + 20, 0); g.lineTo(x + 140, 460); g.lineTo(x - 140, 460); g.fill();
    }
    rrect(-20, 420, W + 40, 140, 30, '#d9b98c');
    for (let x = 0; x < W; x += 80) g.fillRect(x, 420, 2, 120);
    g.fillStyle = 'rgba(0,0,0,.08)';
    const bar = Math.max(0, Math.floor(nb / 3)), bi = nb >= 0 ? Math.floor(nb) % 3 : -1, f = frac(nb);
    const pulse = beatPulse(nb), strong = bi === 0;
    const sway = nb >= 0 ? Math.sin(Math.PI * nb / 3 * 2) * 0.18 : 0;
    // 친구 펭귄: 셋째 박에 몸을 웅크렸다가 "쿵"에 맞춰 폴짝 (미리 보고 준비할 수 있게)
    const crouch = bi === 2 || nb < 0 && nb > -1 ? f * 14 : 0;
    const npcHop = strong ? Math.sin(Math.PI * Math.min(1, f * 1.4)) * 34 : pulse * 6;
    penguin(220, 340 - npcHop + crouch, 62, sway, strong ? pulse : 0, strong && pulse > 0.3);
    penguin(740, 340 - npcHop + crouch, 62, sway, strong ? pulse : 0, strong && pulse > 0.3);
    const pa = pressAnim(nb);
    penguin(480, 330 - pa * 30, 72, -sway + pa * 0.3 * Math.sin(nb * 20), pa, pa > 0.2);
    rrect(430, 435, 100, 32, 16, '#fff'); text('나', 480, 452, 22, '#7b3fd1');
    // 박자 표시: 쿵 짝 짝 — 셋째 박 후반부터는 다음 마디 모양을 미리 보여 줌
    const showBar = Math.min(bi === 2 && f > 0.5 ? bar + 1 : bar, G6_BARS - 1), pat = g6pat(showBar), y = 140;
    rrect(300, y - 42, 360, 84, 42, 'rgba(255,255,255,.92)');
    ['쿵', '짝', '짝'].forEach((w, k) => {
      const x = G6_X[k], isT = pat.includes(k), active = bi === k && nb < S.chart.len;
      const tg = S.targets.find(t => t.bar === showBar && t.p === k);
      const done = tg && tg.res ? (tg.res === 'miss' ? '#c9bdb2' : tg.res === 'perfect' ? '#ffb300' : '#3bb273') : null;
      circ(x, y, (k === 0 ? 30 : 24) + (active ? 6 * pulse : 0), done || (isT ? '#ffd9b8' : active ? '#ffe7a8' : '#f1eaf7'), isT ? '#ff8a3d' : null, 5);
      text(w, x, y + 1, k === 0 ? 28 : 22, '#5a2d82');
    });
    // 줄어드는 고리: 누를 박이 다가오면 고리가 동그라미로 좁혀짐
    for (const t of S.targets) {
      const ahead = t.b - nb;
      if (t.res || ahead < 0 || ahead > 1.5) continue;
      const base = t.p === 0 ? 30 : 24;
      g.globalAlpha = ease(1 - ahead / 1.5) * 0.9 + 0.1;
      circ(G6_X[t.p], y, base + ahead * 45, null, '#ff8a3d', 5);
      g.globalAlpha = 1;
    }
    // 통통 공: 박마다 동그라미 위에 떨어짐 (쿵 → 짝 → 짝 → 다시 쿵)
    if (nb > -1 && nb < S.chart.len) {
      const k = nb < 0 ? 2 : bi, from = G6_X[k], to = G6_X[(k + 1) % 3];
      const hgt = k === 2 ? 55 : 35, bx = from + (to - from) * f, byy = y - 40 - Math.sin(Math.PI * f) * hgt;
      const nextT = S.targets.some(t => t.b === Math.floor(nb) + 1);
      ell(bx, y - 34, 12 * (1 - Math.sin(Math.PI * f) * 0.5), 3, 0, 'rgba(90,45,130,.25)');
      circ(bx, byy, 13, nextT ? '#ff8a3d' : '#c79bff', '#fff', 3);
    }
    if (nb >= 0 && nb < S.chart.len) {
      const next = bar + 1 < G6_BARS && g6label(bar + 1) !== g6label(bar);
      text(next ? '다음: ' + g6label(bar + 1) : g6label(bar), W / 2, 215, 28, next ? '#ffd23d' : '#fff', 'center', '#3a1f6b');
    }
  },
};

const GAMES = [game1, game2, game3, game4, game5, game6];

/* ================= 메인 루프 ================= */
function drawIdle() {
  vgrad('#4b2a85', '#2a1b4d');
}
function frame() {
  if (S && screen === 'play') {
    update();
    if (S && !S.over) {
      const nb = nowBeat();
      S.def.draw(nb);
      drawFx();
      drawHud(nb);
      drawCountIn(nb);
      // 오디오 시계가 멈춰 있으면(iOS가 소리를 막은 경우) 게임도 멈춰 있으니 터치를 부탁
      if (!audioReady()) {
        g.fillStyle = 'rgba(42,27,77,.75)'; g.fillRect(0, 0, W, H);
        text('👆', W / 2, H / 2 - 60, 80, '#fff');
        text('화면을 톡 눌러 주세요!', W / 2, H / 2 + 30, 50, '#ffd23d', 'center', '#5a2d82', 10);
        text('소리가 켜지면 게임이 시작돼요', W / 2, H / 2 + 90, 26, '#fff');
      }
    }
  } else if (!S) drawIdle();
  requestAnimationFrame(frame);
}
renderSelect();
fitCanvas();
requestAnimationFrame(frame);
</script>
